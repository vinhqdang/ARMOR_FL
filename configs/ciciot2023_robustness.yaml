# ARMOR-FL robustness experiment grid on CICIoT2023.
# The full dataset is ~45M rows across 63 files -- essentially every published
# CICIoT2023 paper subsamples for tractability.
#
# 2026-08-28 grid-trimming pass (see PROGRESS.md "grid trimming, round 2"):
# sample_frac cut further (0.02->0.01, ~450k rows) plus the same
# local_epochs/patience/num_rounds/grid-combinatorics cuts as
# cicids2017_robustness.yaml.
name: ciciot2023_robustness
dataset: ciciot2023
raw_dir: data_raw/ciciot2023
sample_frac: 0.01      # ~450k rows; set to null for the full 45M-row dataset
test_frac: 0.2
seed: 0

fl:
  num_clients: 10
  client_fraction: 0.6
  num_rounds: 25
  local_epochs: 10
  patience: 3
  lr: 0.01
  batch_size: 256  # was 32 (paper Table 2) -- see PROGRESS.md batch_size finding
  dropout: 0.5
  attack_start_round: 3
  device: cuda
  log_every: 1
  armor_config:
    alpha_pop: 0.05
    alpha_drift: 0.05
    beta: 4.0
    bet_fraction: 0.5
    burn_in_rounds: 3
    z_bound: 15.0
    drift_bound: 15.0
    probation_rounds: 3
    reinstatement_trust_scale: 0.3
    center_method: trimmed_mean
    trim_fraction: 0.2
  aggregator_kwargs:
    krum:
      num_byzantine_assumed: 3

grid:
  # 2026-09-01 second grid-trimming pass: 7->4 aggregators, 5->3 attacks (user
  # call, see PROGRESS.md) -- 428->152 total run_ids across all 5 configs.
  aggregators: [fedavg, krum, foolsgold, armor]
  attack_types: [label_flip, gaussian_noise, alie]
  malicious_fractions: [0.2, 0.4]
  non_iid_alphas: [null, 0.5]
