# ARMOR-FL robustness experiment grid on CICIDS2017.
# Mirrors the FedSE-1DSqueezeNet paper's FL hyperparameters (Table 2) where
# comparable, but uses more communication rounds than their R=5 so the
# e-process-based defenses have room to accumulate evidence -- R=5 is only
# enough for a single post-burn-in decision round.
#
# 2026-08-28 grid-trimming pass (see PROGRESS.md "grid trimming, round 2" for
# the full wall-clock accounting): sample_frac/local_epochs/num_rounds cut and
# grid combinatorics reduced (non_iid_alphas, malicious_fractions 4->2 each)
# to bring the full 3-dataset grid down from an infeasible ~102-248 GPU-days
# estimate. local_epochs=10/patience=3 measured at 308s/round on this
# machine's GPU (vs 426s/round at local_epochs=20/patience=5, and 564s/round
# pre-optimization at local_epochs=20) -- less-than-linear savings from
# cutting epochs because patience was already triggering early stopping most
# of the time. sample_frac=0.1 matches the wall-clock benchmark exactly (was
# null/full 2.26M rows, a previously-unaccounted ~10x cost multiplier).
name: cicids2017_robustness
dataset: cicids2017
raw_dir: data_raw/cicids2017
sample_frac: 0.1
test_frac: 0.2
seed: 0

fl:
  num_clients: 10
  client_fraction: 0.6
  num_rounds: 25
  local_epochs: 10
  patience: 3
  lr: 0.01
  batch_size: 256  # was 32 (paper Table 2) -- see PROGRESS.md batch_size finding
  dropout: 0.5
  attack_start_round: 3
  device: cuda
  log_every: 1
  armor_config:
    alpha_pop: 0.05
    alpha_drift: 0.05
    beta: 4.0
    bet_fraction: 0.5
    burn_in_rounds: 3
    z_bound: 15.0
    drift_bound: 15.0
    probation_rounds: 3
    reinstatement_trust_scale: 0.3
    center_method: trimmed_mean
    trim_fraction: 0.2
  aggregator_kwargs:
    krum:
      num_byzantine_assumed: 3

grid:
  # 2026-09-01 second grid-trimming pass: 7->4 aggregators, 5->3 attacks (user
  # call, see PROGRESS.md) -- 428->152 total run_ids across all 5 configs.
  aggregators: [fedavg, krum, foolsgold, armor]
  attack_types: [label_flip, gaussian_noise, alie]
  malicious_fractions: [0.2, 0.4]
  non_iid_alphas: [null, 0.5]
